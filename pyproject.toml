[project]
name = "maple-font"
version = "8.0b1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fontmake~=3.12",
    "fonttools[woff]~=4.63",
    "glyphsLib~=6.13",
    "py7zr~=1.1",
    "skia-pathops~=0.9",
    "ttfautohint-py~=0.6",
]

[dependency-groups]
dev = [
    "fontbakery[googlefonts]==1.1.0",
    "gftools==0.9.97",
    "pyrefly~=1.1",
    "questionary~=2.1",
    "ruff~=0.15",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["FontPatcher"]

[tool.ruff.lint]
extend-select = [
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff

    "A",     # flake8-builtins
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "LOG",   # flake8-logging
    "TCH",   # flake8-type-checking

    "FLY",   # flynt
    "PERF",  # Perflint
    "FURB",  # refurb

    "T20",   # flake8-print
]

ignore = [
    "E501",
    "RET504",
]
unfixable = ["B028"]
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fontTools.ttLib.TTFont" = { msg = "Use scripts.font_ops.fonttools.TTFont instead." }
"fontTools.varLib.TTFont" = { msg = "Use scripts.font_ops.fonttools.TTFont instead." }
"fontTools.varLib.instancer.instantiateVariableFont" = { msg = "Use scripts.font_ops.fonttools.instantiate_variable_font instead." }

[tool.ruff.lint.per-file-ignores]
# The wrapper owns the one raw FontTools import; the browser script is generated standalone.
"scripts/font_ops/fonttools.py" = ["TID251"]
"scripts/in_browser.py" = ["T20", "TID251"]
"scripts/pipeline/orchestrator.py" = ["T20"]
"scripts/task/publish.py" = ["T20"]
"scripts/task/release.py" = ["T20"]
"scripts/feature/ast.py" = ["RUF001"]
"scripts/feature/cv/cv96.py" = ["RUF001"]
"scripts/feature/cv/cv99.py" = ["RUF001"]
"scripts/feature/ss/ss13.py" = ["RUF001"]

[tool.pyrefly]
project-includes = ["scripts/**/*.py", "build.py", "task.py"]
project-excludes = ["FontPatcher/**"]
python-version = "3.10"

name: Python Quality

on:
  push:
    branches:
      - "variable"
    paths:
      - "**.py"
      - "config.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "**.py"
      - "config.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Check exported requirements
        run: |
          uv export --locked --no-dev --no-hashes --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Sync locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyrefly check
      - name: Run unit tests
        run: uv run python -m unittest discover -s scripts/tests
      - name: Validate CI dry-run JSON
        run: GITHUB_ACTIONS=1 uv run build.py --dry | uv run python -m json.tool
